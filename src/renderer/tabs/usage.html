<div class="section" id="usage-filters">
  <div class="section-title">Filters</div>
  <div class="filter-row">
    <label class="filter-label" for="filter-date-range">Period</label>
    <select id="filter-date-range" class="filter-select">
      <option value="">All time</option>
      <option value="today">Today</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
    </select>
  </div>
  <div class="filter-row">
    <label class="filter-label" for="filter-project">Project</label>
    <select id="filter-project" class="filter-select">
      <option value="">All projects</option>
    </select>
  </div>
  <div class="filter-row">
    <label class="filter-label" for="filter-session">Session</label>
    <select id="filter-session" class="filter-select">
      <option value="">All sessions</option>
    </select>
  </div>
</div>
<div class="section usage-export-row">
  <button id="export-csv-btn" class="btn-export">Copy CSV</button>
</div>
<div class="section">
  <div class="section-title">Event Log</div>
  <div id="event-log" class="event-log">
    <div class="usage-empty">No events yet</div>
  </div>
  <div id="event-pagination" class="event-pagination" style="display:none;">
    <button id="page-prev" class="page-btn">&lsaquo;</button>
    <span id="page-info" class="page-info"></span>
    <button id="page-next" class="page-btn">&rsaquo;</button>
  </div>
</div>
<div class="section">
  <div class="section-title">MCP Tools</div>
  <div id="mcp-usage-list" class="usage-list">
    <div class="usage-empty">No MCP tool usage yet</div>
  </div>
</div>
<div class="section">
  <div class="section-title">Skills</div>
  <div id="skill-usage-list" class="usage-list">
    <div class="usage-empty">No skill usage yet</div>
  </div>
</div>
