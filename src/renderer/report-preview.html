<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code Pet — Skill Usage Report</title>
<style>
/* Palette mirrors the app chrome (settings.css, Catppuccin Mocha, dark-only). */
:root {
  --page: #1e1e2e; --chrome: #181825;
  --ink: #cdd6f4; --divider: #313244; --accent: #89b4fa;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--page);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
}
.report-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--chrome);
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
}
.toolbar-title { color: var(--ink); font-size: 12px; font-weight: 600; margin-right: auto; }
.toolbar-btn {
  font: inherit;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.toolbar-btn:hover { background: var(--accent); color: #1e1e2e; }
#report-frame { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
<div class="report-toolbar">
  <span class="toolbar-title">Skill Usage Report</span>
  <button id="save-html-btn" class="toolbar-btn">Save as HTML</button>
  <button id="save-md-btn" class="toolbar-btn">Save as Markdown</button>
</div>
<iframe id="report-frame" sandbox=""></iframe>
<script src="report-preview.js"></script>
</body>
</html>
