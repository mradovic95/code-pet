<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Pet Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">Code Pet Settings</span>
    <button id="close-btn" class="titlebar-close">&times;</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" data-tab="general">General</button>
    <button class="tab" data-tab="store" id="tab-btn-store" style="display:none;">Store</button>
    <button class="tab" data-tab="usage" id="tab-btn-usage" style="display:none;">Usage</button>
  </div>
  <div class="content">
    <div id="tab-general"></div>
    <div id="tab-store" style="display:none;"></div>
    <div id="tab-usage" style="display:none;"></div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
