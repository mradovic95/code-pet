<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Pet Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">Code Pet Settings</span>
    <button id="close-btn" class="titlebar-close">&times;</button>
  </div>
  <div class="content">
    <div id="project-label" class="project-label"></div>
    <div class="section">
      <div class="section-title">Your Pets</div>
      <div id="pet-selector"></div>
    </div>
    <div class="section" id="marketplace-section" style="display:none;">
      <div class="section-title">Get More Pets</div>
      <div id="marketplace-grid"></div>
    </div>
    <div class="section" id="license-section">
      <div class="license-row">
        <input type="text" id="license-input" class="license-input" placeholder="Enter license key">
        <button id="license-btn" class="license-btn">Activate</button>
      </div>
      <div id="license-status" class="license-status"></div>
    </div>
    <div class="section">
      <div class="section-title">Sound</div>
      <label class="toggle-row">
        <input type="checkbox" id="sound-toggle">
        <span>Play sound on permission prompt</span>
      </label>
    </div>
    <div class="section">
      <div class="section-title">Actions</div>
      <button id="dismiss-btn" class="btn-dismiss">Dismiss Pet</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
